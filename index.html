<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neuhold Family</title>
  <meta name="description" content="Die Website der Familie Neuhold – bald hier.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a34'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='32' text-anchor='middle' fill='%23f4efe6'%3EN%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f4efe6;
      --ink: #1f2a27;
      --muted: #5e6b66;
      --accent: #1f3a34;
      --line: #d9d0c1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141917;
        --ink: #ece6da;
        --muted: #9aa69f;
        --accent: #8fb8a8;
        --line: #2b3431;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { max-width: 34rem; }
    .mark {
      width: 72px; height: 72px;
      margin: 0 auto 28px;
      border-radius: 18px;
      background: var(--accent);
      color: var(--bg);
      display: grid; place-items: center;
      font: 400 38px/1 Georgia, "Times New Roman", serif;
    }
    h1 {
      font: 400 clamp(2.2rem, 7vw, 3.4rem)/1.1 Georgia, "Times New Roman", serif;
      letter-spacing: -0.01em;
    }
    .rule {
      width: 48px; height: 2px;
      background: var(--accent);
      margin: 24px auto;
      opacity: .7;
    }
    p { color: var(--muted); font-size: 1.1rem; line-height: 1.6; }
    .tag {
      display: inline-block;
      margin-top: 28px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: .8rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    footer {
      position: fixed; bottom: 16px; left: 0; right: 0;
      font-size: .8rem; color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">N</div>
    <h1>Familie Neuhold</h1>
    <div class="rule"></div>
    <p>Hier entsteht gerade unsere neue Website.<br>Schau bald wieder vorbei.</p>
    <span class="tag">Under construction</span>
  </main>
  <footer>&copy; <span id="y">2026</span> neuhold-family.com</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
